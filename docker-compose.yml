  meltano-api-xcon:
    build:
      context: ./tap_adventureworksapi_teste_xcon
      dockerfile: meltano_api.Dockerfile
    image: meltano-api-xcon:latest
    env_file: .env
    volumes:
      - ./output/api:/app/output
      - /var/run/docker.sock:/var/run/docker.sock
      - shared-api:/app/output

  spark-db:
    build:
      context: ./spark-db-copy
      dockerfile: spark.Dockerfile
    image: spark-db:latest
    env_file: .env
    volumes:
      # - ./output/db:/app/spark_output/db    # Volume dedicado para DB
      - /var/run/docker.sock:/var/run/docker.sock
      - ./output/teste_db:/app/output/db
      # - shared-db:/output/db

  # databricks-upload:
  #   build: 
  #     context: ./databricks-upload
  #     dockerfile: databricks-upload.Dockerfile
  #   image: databricks-upload:latest
  #   env_file: .env
  #   volumes:
  #     - ./output/db:/app/output/bd
  #     - ./output/api:/app/output/api
  #     - /var/run/docker.sock:/var/run/docker.sock

  databricks-ingest:
    build:
      context: ./databricks-ingest
      dockerfile: databricks-ingest.Dockerfile
    image: databricks-ingest:latest
    container_name: databricks_ingest
    env_file:
      - .env
    volumes:
      - shared-api:/app/output/api
      - /var/run/docker.sock:/var/run/docker.sock
      - shared-db:/output/db

  # alpine:
  #   build:
  #     context: ./alpine
  #     dockerfile: alpine.Dockerfile
  #   container_name: alpine
  #   image: alpine
  #   env_file:
  #     - .env
  #   restart: "no"

  # Serviço responsável por inicializar o banco de dados do Airflow automaticamente
  airflow-init:
    image: apache/airflow:2.10.4-python3.11
    container_name: airflow_init                        # Nome do contêiner de inicialização
    depends_on:
      - airflow-db                                      # Espera o banco estar pronto antes de executar
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags    # Caminho das DAGs dentro do contêiner
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow  # Conexão com o PostgreSQL
      - AIRFLOW__LOGGING__REMOTE_LOGGING=False          # Desabilita o logging remoto
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags                       # Mapeia as DAGs do host para o contêine
      - /var/run/docker.sock:/var/run/docker.sock
      - shared-api:/opt/airflow/output/api
      - ./config:/opt/airflow/config:ro
    entrypoint: airflow db migrate # Comando que será executado ao rodar este serviço
    networks:
      - airflow_net

  # Serviço: Webserver do Airflow (interface web)
  airflow-webserver:
    image: apache/airflow:2.10.4-python3.11
    container_name: airflow_webserver
    user: root                                   # Executa como root para evitar problemas de permissão
    restart: always
    depends_on:
      - airflow-scheduler
      - airflow-db
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow  # Conexão com o PostgreSQL
      - AIRFLOW__LOGGING__REMOTE_LOGGING=False           # Desabilita o logging remoto     
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor

      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=airflow
      - _AIRFLOW_WWW_USER_PASSWORD=airflow
      - _AIRFLOW_WWW_USER_FIRSTNAME=Admin
      - _AIRFLOW_WWW_USER_LASTNAME=User
      - _AIRFLOW_WWW_USER_EMAIL=airflow@example.com
      - _AIRFLOW_WWW_USER_ROLE=Admin
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - PYTHONPATH=/opt/airflow
    ports:
      - "8080:8080"                                      # Porta mapeada para acesso à UI
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs                        # Adiciona esse volume para persistência de logs
      - /var/run/docker.sock:/var/run/docker.sock        # Adiciona esse volume expor o socket do Docker
      - ./config:/opt/airflow/config:ro
      - shared-api:/opt/airflow/output/api
    command: webserver
    networks:
      - airflow_net

  # Serviço: Scheduler do Airflow (responsável por agendar e iniciar tasks)
  airflow-scheduler:
    image: apache/airflow:2.10.4-python3.11
    # image: apache/airflow:3.0.1-python3.11
    container_name: airflow_scheduler
    user: root                                   # Executa como root para evitar problemas de permissão
    restart: always
    depends_on:
      - airflow-db
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow  # Conexão com o PostgreSQL
      - AIRFLOW__LOGGING__REMOTE_LOGGING=False          # Desabilita o logging remoto
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./output/api:/opt/airflow/output/api
      - ./output/db:/opt/airflow/output/db
      - ./logs:/opt/airflow/logs                       # Adiciona esse volume para persistência de logs
      - /var/run/docker.sock:/var/run/docker.sock       # Adiciona esse volume expor o socket do Docker
      - ./config:/opt/airflow/config:ro
      - shared-api:/opt/airflow/output/api
    command: scheduler
    networks:
      - airflow_net

  airflow-worker:
    image: apache/airflow:2.10.4-python3.11
    user: root
    restart: always
    depends_on:
      - airflow-init
      - redis
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./output/api:/opt/airflow/output/api
      - ./output/db:/opt/airflow/output/bd
      - /var/run/docker.sock:/var/run/docker.sock
      - shared-api:/opt/airflow/output/api
      - ./config:/opt/airflow/config:ro
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@airflow-db/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - PYTHONPATH=/opt/airflow
    command: celery worker
    networks:
      - airflow_net

  redis:
    image: redis:latest
    env_file:
      - .env
    volumes:
      - redis_data:/data  # Usa o volume nomeado
    ports:
      - "6379:6379"
    networks:
    - airflow_net

  # Serviço: Banco de dados PostgreSQL usado pelo Airflow
  airflow-db:
    image: postgres:15
    container_name: airflow_postgres
    restart: always
    environment:
      POSTGRES_USER: airflow                           # Nome do usuário do banco
      POSTGRES_PASSWORD: airflow                       # Senha do banco
      POSTGRES_DB: airflow                             # Nome do banco
    volumes:
      - pgdata:/var/lib/postgresql/data                # Volume para persistência dos dados
    networks:
      - airflow_net

  airflow-triggerer:
    image: apache/airflow:2.10.4-python3.11
    user: root
    restart: always
    depends_on:
      - airflow-scheduler
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./output/api:/opt/airflow/output/api
      - ./output/db:/opt/airflow/output/bd
      - /var/run/docker.sock:/var/run/docker.sock
      - shared-api:/opt/airflow/output/api
      - ./config:/opt/airflow/config:ro
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@airflow-db/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - PYTHONPATH=/opt/airflow
    command: triggerer
    networks:
      - airflow_net

# Volume nomeado para persistência dos dados do PostgreSQL
volumes:
  pgdata:
  redis_data:  # Novo volume para Redis
  shared-api:
      driver: local
  shared-db:
      driver: local

# Rede interna para comunicação entre os contêineres
networks:
  airflow_net:
