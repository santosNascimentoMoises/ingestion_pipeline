name: ELT Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  elt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: MELTANO DB
        run: 
          docker compose run --rm meltano-db

      - name: serviços
        run: |
          docker compose logs

      - name: AZURE
        run: 
          docker compose run --rm azure-ingestion

      - name: DATABRIX
        run: 
          docker compose run --rm databricks-upload

      - name: finaliza containers
        if: always()
        run: docker compose down
