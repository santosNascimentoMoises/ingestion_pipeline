name: ELT Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  elt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: SPARK DB
        run: 
          docker compose run --rm spark-db

      - name: AZURE
        run: 
          docker compose run --rm azure-ingestion

      # - name: DATABRIX
      #   run: 
      #     docker compose run --rm databricks-upload

      - name: finaliza containers
        if: always()
        run: docker compose down
