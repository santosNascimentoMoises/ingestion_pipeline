version: 2

models:
  - name: stg_product_category
    description: "Staging model for product category data."
    columns:
      - name: modified_date
        data_type: timestamp
        description: "Date and time the record was last modified in the source system."

      - name: product_category_name
        data_type: string
        description: "The name of the product category."

      - name: product_category_id
        data_type: string
        description: "Primary key for the product category."

      - name: load_at
        data_type: timestamp
        description: "Timestamp of when the record was loaded into the staging table."
