version: 2

models:
  - name: stg_country_region
    description: "Staging model for country and region data."
    columns:
      - name: country_region_code
        data_type: string
        description: "The ISO standard code for the country or region."

      - name: country_name
        data_type: string
        description: "The name of the country or region."

      - name: load_at
        data_type: timestamp
        description: "Timestamp of when the record was loaded into the staging table."
