version: 2

models:
  - name: stg_address
    description: "Staging model for address data."
    columns:
      - name: address_id
        data_type: string
        description: "Primary key for the address."

      - name: address_line1
        data_type: string
        description: "First line of the street address."

      - name: address_line2
        data_type: string
        description: "Second line of the street address (e.g., apartment, suite)."

      - name: city
        data_type: string
        description: "The city name."

      - name: postal_code
        data_type: string
        description: "The postal or zip code for the address."

      - name: state_province_id
        data_type: string
        description: "Foreign key to the state or province."

      - name: load_at
        data_type: timestamp
        description: "Timestamp of when the record was loaded into the staging table."
