version: 2

models:
  - name: dim_sales_person
    description: "Dimension table containing attributes for each salesperson."
    columns:
      - name: sales_person_sk
        tests:
          - not_null
          - unique
        data_type: string
        description: "The surrogate key for the sales person dimension, generated by dbt."

      - name: business_entity_id
        data_type: string
        description: "Foreign key to the business entity (e.g., a customer, a store)."

      - name: sales_person_id
        data_type: string
        description: "Foreign key to the salesperson assigned to the store."

      - name: address_id
        data_type: string
        description: "Foreign key to the address."

      - name: first_name
        data_type: string
        description: "The person s first name."

      - name: last_name
        data_type: string
        description: "The person s last name."

      - name: store_name
        data_type: string
        description: "The name of the store."

      - name: sales_last_year
        data_type: float
        description: "Total sales from the previous year."

      - name: sales_quota
        data_type: float
        description: "The sales quota for the salesperson for the current period."

      - name: sales_ytd
        data_type: float
        description: "Total sales year-to-date."

      - name: commission_pct
        data_type: float
        description: "The salesperson s commission percentage."

      - name: bonus
        data_type: float
        description: "Bonus amount earned during the current year."

      - name: middle_name
        data_type: string
        description: "The person s middle name or initial."

      - name: person_type
        data_type: string
        description: "The type of person (e.g., SC for Store Contact, IN for Individual Customer)."

      - name: suffix
        data_type: string
        description: "Suffix for the person s name (e.g., Jr., Sr.)."

      - name: title
        data_type: string
        description: "Title for the person s name (e.g., Mr., Ms., Dr.)."

      - name: email_promotion
        data_type: string
        description: "Indicates the type of email promotions the person wishes to receive (0=None, 1=Standard, 2=All)."

      - name: territory_id
        data_type: string
        description: "Foreign key to the sales territory the person is assigned to."
