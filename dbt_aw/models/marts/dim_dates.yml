version: 2

models:
  - name: dim_dates
    description: "Dimension table containing a record for each date, enriched with various date-related attributes for analysis."
    columns:
      - name: date_sk
        data_type: string
        description: "The surrogate key for the date dimension, generated by dbt."

      - name: date_day
        data_type: date
        description: "The specific date for the record (e.g., 2023-10-27)."

      - name: prior_date_day
        data_type: date
        description: "The date of the previous day."

      - name: next_date_day
        data_type: date
        description: "The date of the following day."

      - name: prior_year_date_day
        data_type: date
        description: "The same date in the previous year."

      - name: prior_year_over_year_date_day
        data_type: date
        description: "The corresponding date in the previous year for year-over-year comparison (handles leap years)."

      - name: day_of_week
        data_type: int
        description: "The day of the week as a number (e.g., Sunday=1, Saturday=7, depends on system settings)."

      - name: day_of_week_iso
        data_type: int
        description: "The day of the week according to the ISO 8601 standard (Monday=1, Sunday=7)."

      - name: day_of_week_name
        data_type: string
        description: "The full name of the day of the week (e.g., Monday)."

      - name: day_of_week_name_short
        data_type: string
        description: "The abbreviated name of the day of the week (e.g., Mon)."

      - name: day_of_month
        data_type: int
        description: "The day number within the month (e.g., 27)."

      - name: day_of_year
        data_type: int
        description: "The day number within the year (e.g., 300)."

      - name: week_start_date
        data_type: date
        description: "The start date of the week that the date falls into (e.g., starts on Sunday)."

      - name: week_end_date
        data_type: date
        description: "The end date of the week that the date falls into (e.g., ends on Saturday)."

      - name: prior_year_week_start_date
        data_type: date
        description: "The start date of the corresponding week in the prior year."

      - name: prior_year_week_end_date
        data_type: date
        description: "The end date of the corresponding week in the prior year."

      - name: week_of_year
        data_type: int
        description: "The week number within the year (e.g., 43)."

      - name: iso_week_start_date
        data_type: date
        description: "The start date of the ISO week (always a Monday)."

      - name: iso_week_end_date
        data_type: date
        description: "The end date of the ISO week (always a Sunday)."

      - name: prior_year_iso_week_start_date
        data_type: date
        description: "The start date of the corresponding ISO week in the prior year."

      - name: prior_year_iso_week_end_date
        data_type: date
        description: "The end date of the corresponding ISO week in the prior year."

      - name: iso_week_of_year
        data_type: int
        description: "The ISO 8601 week number of the year."

      - name: iso_year_week
        data_type: string
        description: "The ISO year and week number combined (e.g., 2023-W43)."

      - name: prior_year_week_of_year
        data_type: int
        description: "The week number of the corresponding week in the prior year."

      - name: prior_year_iso_week_of_year
        data_type: int
        description: "The ISO week number of the corresponding week in the prior year."

      - name: month_of_year
        data_type: int
        description: "The month number within the year (1-12)."

      - name: month_name
        data_type: string
        description: "The full name of the month (e.g., October)."

      - name: month_name_short
        data_type: string
        description: "The abbreviated name of the month (e.g., Oct)."

      - name: month_start_date
        data_type: date
        description: "The first day of the month."

      - name: month_end_date
        data_type: date
        description: "The last day of the month."

      - name: prior_year_month_start_date
        data_type: date
        description: "The start date of the corresponding month in the prior year."

      - name: prior_year_month_end_date
        data_type: date
        description: "The end date of the corresponding month in the prior year."

      - name: quarter_of_year
        data_type: int
        description: "The quarter number within the year (1-4)."

      - name: quarter_start_date
        data_type: date
        description: "The first day of the quarter."

      - name: quarter_end_date
        data_type: date
        description: "The last day of the quarter."

      - name: year_number
        data_type: int
        description: "The four-digit year (e.g., 2023)."

      - name: year_start_date
        data_type: date
        description: "The first day of the year (January 1st)."

      - name: year_end_date
        data_type: date
        description: "The last day of the year (December 31st)."