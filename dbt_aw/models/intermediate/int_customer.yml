version: 2

models:
  - name: int_customer
    description: "Intermediate model that combines customer account information with detailed personal information for each customer."
    columns:
      - name: customer_id
        data_type: string
        description: "Primary key for the customer."

      - name: person_id
        data_type: string
        description: "Foreign key to the person associated with this customer account."

      - name: store_id
        data_type: string
        description: "Foreign key to the store where the customer was acquired or shops."

      - name: account_number
        data_type: string
        description: "Unique account number assigned to the customer."

      - name: person_type
        data_type: string
        description: "The type of person (e.g., SC for Store Contact, IN for Individual Customer)."

      - name: title
        data_type: string
        description: "Title for the person s name (e.g., Mr., Ms., Dr.)."

      - name: first_name
        data_type: string
        description: "The person s first name."

      - name: middle_name
        data_type: string
        description: "The person s middle name or initial."

      - name: last_name
        data_type: string
        description: "The person s last name."

      - name: suffix
        data_type: string
        description: "Suffix for the person s name (e.g., Jr., Sr.)."

      - name: email_promotion
        data_type: string
        description: "Indicates the type of email promotions the person wishes to receive (0=None, 1=Standard, 2=All)."

      - name: demographics
        data_type: string
        description: "XML column containing demographic information such as birth date and marital status."